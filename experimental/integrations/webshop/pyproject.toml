[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rethinkskill-webshop"
version = "0.1.0"
description = "Experimental official-environment WebShop adapter for rethinkskill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "rethinkskill>=1.1,<2",
]

[project.entry-points."rethinkskill.harnesses"]
webshop = "rethinkskill_webshop.plugin:spec"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
